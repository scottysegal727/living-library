<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Living Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* PocketMFA site colours: navy band, red for actions, white page. Layout: header band, filter bar, card grid. */
  --navy:#133852;
  --red:#dc2d3c;
  --red-dark:#b4202d;
  --ink:#333333;
  --muted:#5f6b76;
  --line:#e1e5ea;
  --wash:#f3f5f7;
  --page:#ffffff;
  --display:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
a{color:inherit}
.band{background:var(--navy);color:#fff;padding:20px}
.band-inner,.bar-inner,.main{max-width:1180px;margin:0 auto}
.band h1{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,3.2vw,2rem);margin:0;letter-spacing:.005em;text-wrap:balance}
.band p{margin:6px 0 0;color:#d5e0e8;font-size:.98rem;max-width:62ch}
.bar{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--line);padding:14px 20px 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;padding:10px 12px 10px 38px;border:1px solid #c9d1d9;border-radius:8px;background:#fff;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
select{font:inherit;font-size:.95rem;padding:9px 30px 9px 11px;border:1px solid #c9d1d9;border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
label.sel{display:flex;flex-direction:column;gap:3px;font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.selects{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font:inherit;font-size:.93rem;border:1px solid #c9d1d9;background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:5px;font-size:.85em}
.chip:hover{border-color:var(--red)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed="true"] span{color:#fde3e5}
.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;font-size:.95rem;color:var(--muted)}
.status strong{color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--red);text-decoration:underline;cursor:pointer}
.view{display:inline-flex;border:1px solid #c9d1d9;border-radius:8px;overflow:hidden}
.view button{font:inherit;font-size:.9rem;border:0;background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
.view button[aria-pressed="true"]{background:var(--navy);color:#fff}
.main{padding:20px 20px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px;list-style:none;margin:0;padding:0}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{display:block;aspect-ratio:2/3;background:var(--wash);border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:contain;display:block}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-family:var(--display);font-size:.95rem;line-height:1.3;color:#fff;background:var(--navy);overflow-wrap:anywhere}
.cover.has-img .ph{display:none}
.title{font-family:var(--display);font-weight:700;font-size:.98rem;line-height:1.3;margin:0;overflow-wrap:anywhere}
.title a{text-decoration:none}
.title a:hover{text-decoration:underline;color:var(--red-dark)}
.author{margin:0;font-size:.95rem}
.meta{margin:0;font-size:.84rem;color:var(--muted)}
.cat{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--red-dark)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:inherit;font-size:.78rem;border:0;background:var(--wash);color:var(--ink);border-radius:4px;padding:2px 7px;cursor:pointer;text-align:left}
.tag:hover{background:#e3e8ed}
.buy{margin-top:auto;align-self:flex-start;font-size:.9rem;font-weight:600;color:#fff;background:var(--red);text-decoration:none;border-radius:6px;padding:6px 11px}
.buy:hover{background:var(--red-dark)}
.desc{display:none;margin:0;font-size:.93rem;color:#444;max-width:70ch}
.list .grid{grid-template-columns:1fr;gap:0}
.list .card{display:grid;grid-template-columns:86px 1fr;grid-template-areas:"cover cat" "cover title" "cover author" "cover meta" "cover desc" "cover tags" "cover buy";column-gap:16px;row-gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
.list .cover{grid-area:cover;align-self:start}
.list .cover .ph{font-size:.62rem;padding:6px}
.list .cat{grid-area:cat}.list .title{grid-area:title;font-size:1.08rem}.list .author{grid-area:author}.list .meta{grid-area:meta}
.list .desc{grid-area:desc;display:block;margin-top:4px}.list .tags{grid-area:tags;margin-top:4px}.list .buy{grid-area:buy;margin-top:8px;justify-self:start}
.more{display:flex;justify-content:center;margin-top:26px}
.more button{font:inherit;font-weight:600;border:1px solid var(--red);color:var(--red-dark);background:#fff;border-radius:8px;padding:10px 20px;cursor:pointer}
.more button:hover{background:var(--wash)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:.88rem;color:var(--muted);max-width:75ch}
.foot a{color:var(--red-dark)}
:focus-visible{outline:3px solid #2f7fc1;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .band{padding:18px 16px}.bar{padding:12px 16px;position:static}.main{padding:16px 16px 28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .selects{width:100%}.selects label.sel{flex:1 1 130px}.selects select{width:100%}
  .list .card{grid-template-columns:64px 1fr;column-gap:12px}
}
</style>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <h1>The Living Library</h1>
  </div>
</header>

<div class="bar">
  <div class="bar-inner">
    <div class="row">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr" for="ll-q">Search the library</label>
        <input id="ll-q" type="search" placeholder="Search title, author, subject…" autocomplete="off">
      </div>
      <div class="selects">
        <label class="sel" for="ll-genre">Genre
          <select id="ll-genre"><option value="">All genres</option></select>
        </label>
        <label class="sel" for="ll-topic">Subject
          <select id="ll-topic"><option value="">All subjects</option></select>
        </label>
        <label class="sel" for="ll-sort">Sort by
          <select id="ll-sort">
            <option value="title">Title A–Z</option>
            <option value="author">Author A–Z</option>
            <option value="category">Category</option>
            <option value="new">Newest edition</option>
            <option value="short">Shortest first</option>
            <option value="long">Longest first</option>
          </select>
        </label>
      </div>
    </div>
    <div class="chips" id="ll-cats" role="group" aria-label="Category"></div>
    <div class="status">
      <div><span id="ll-count" aria-live="polite"></span> <button class="linkbtn" id="ll-clear" hidden>Clear filters</button></div>
      <div class="view" role="group" aria-label="View">
        <button id="ll-vgrid" aria-pressed="true">Covers</button>
        <button id="ll-vlist" aria-pressed="false">Details</button>
      </div>
    </div>
  </div>
</div>

<main class="main" id="ll-main">
  <ul class="grid" id="ll-grid"></ul>
  <div class="empty" id="ll-empty" hidden>No books match. Try a different word, or clear the filters.</div>
  <div class="more"><button id="ll-more" hidden>Show more books</button></div>
  <p class="foot"><a href="https://bookshop.org/lists/the-living-library" target="_blank" rel="noopener sponsored">See the full list on Bookshop.org</a>.</p>
</main>

<script id="ll-data" type="application/json">__DATA__</script>
<script id="ll-covers" type="application/json">__COVERS__</script>
<script>
(function(){
  var AID='113073';
  var BOOKS=JSON.parse(document.getElementById('ll-data').textContent);
  var COVERS={};try{COVERS=JSON.parse(document.getElementById('ll-covers').textContent)}catch(e){}
  var CAT_ORDER=['Fiction','Short Stories','Poetry','Memoir & Biography','Essays & Nonfiction','Craft & Criticism','Plays & Graphic Works'];
  var PAGE=48;
  var state={q:'',cat:'',genre:'',topic:'',sort:'title',view:'grid',shown:PAGE};
  var $=function(id){return document.getElementById(id)};
  var norm=function(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};
  var sortTitle=function(t){return norm(t).replace(/^(the|a|an)\s+/,'').replace(/[^a-z0-9 ]/g,'')};
  var lastName=function(a){var p=norm(a).replace(/\s+(jr\.?|sr\.?|iii|ii|phd)$/,'').split(' ');return p[p.length-1]+' '+p.slice(0,-1).join(' ')};
  BOOKS.forEach(function(b){
    b._t=sortTitle(b.t); b._a=lastName(b.a);
    b._s=norm([b.t,b.a,b.c,b.g.join(' '),b.k.join(' '),b.p,b.d].join(' \n '));
  });

  // filter options
  var count=function(key){var m={};BOOKS.forEach(function(b){b[key].forEach(function(v){m[v]=(m[v]||0)+1})});return m};
  var fill=function(sel,m,min){Object.keys(m).filter(function(k){return m[k]>=min}).sort().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k+' ('+m[k]+')';sel.appendChild(o)})};
  fill($('ll-genre'),count('g'),1);
  fill($('ll-topic'),count('k'),3);
  var catCount={};BOOKS.forEach(function(b){catCount[b.c]=(catCount[b.c]||0)+1});
  var chip=function(label,val,n){var b=document.createElement('button');b.className='chip';b.type='button';b.dataset.cat=val;b.setAttribute('aria-pressed',val===''?'true':'false');b.appendChild(document.createTextNode(label));var s=document.createElement('span');s.textContent=n;b.appendChild(s);return b};
  var cats=$('ll-cats');cats.appendChild(chip('All','',BOOKS.length));
  CAT_ORDER.forEach(function(c){if(catCount[c])cats.appendChild(chip(c,c,catCount[c]))});

  var el=function(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
  var link=function(b){return 'https://bookshop.org/a/'+AID+'/'+b.i};
  function card(b){
    var li=el('li','card');
    var a=el('a','cover');a.href=link(b);a.target='_blank';a.rel='noopener sponsored';a.setAttribute('aria-label',b.t+' by '+b.a+' on Bookshop.org');
    a.appendChild(el('span','ph',b.t));
    var img=new Image();img.alt='';img.decoding='async';
    var remote='https://images-us.bookshop.org/ingram/'+b.i+'.jpg?v=enc-v1&height=360';
    if(COVERS[b.i]){
      // small cover is built into the file; a sharper one replaces it when the page can reach Bookshop
      img.src='data:image/webp;base64,'+COVERS[b.i];a.classList.add('has-img');
      var hi=new Image();hi.onload=function(){if(hi.naturalWidth>1)img.src=remote};hi.src=remote;
    }else{
      img.onload=function(){if(img.naturalWidth>1)a.classList.add('has-img')};
      img.onerror=function(){img.remove()};img.src=remote;
    }
    a.appendChild(img);li.appendChild(a);
    li.appendChild(el('span','cat',b.c));
    var h=el('h2','title');var ta=el('a',null,b.t);ta.href=link(b);ta.target='_blank';ta.rel='noopener sponsored';h.appendChild(ta);li.appendChild(h);
    li.appendChild(el('p','author',b.a));
    var bits=[b.f];if(b.pg)bits.push(b.pg+' pages');if(b.p)bits.push(b.p+(b.y?' '+b.y:''));
    li.appendChild(el('p','meta',bits.join(' · ')));
    if(b.d)li.appendChild(el('p','desc',b.d+(b.d.length>=318?'…':'')));
    if(b.k.length){var tg=el('div','tags');b.k.slice(0,3).forEach(function(k){var t=el('button','tag',k);t.type='button';t.dataset.topic=k;t.title='Show all books filed under '+k;tg.appendChild(t)});li.appendChild(tg)}
    var buy=el('a','buy','Buy on Bookshop');buy.href=link(b);buy.target='_blank';buy.rel='noopener sponsored';li.appendChild(buy);
    return li;
  }
  var SORT={
    title:function(a,b){return a._t<b._t?-1:a._t>b._t?1:0},
    author:function(a,b){return a._a<b._a?-1:a._a>b._a?1:SORT.title(a,b)},
    category:function(a,b){return (CAT_ORDER.indexOf(a.c)-CAT_ORDER.indexOf(b.c))||SORT.title(a,b)},
    new:function(a,b){return (b.y-a.y)||SORT.title(a,b)},
    short:function(a,b){return ((a.pg||1e9)-(b.pg||1e9))||SORT.title(a,b)},
    long:function(a,b){return (b.pg-a.pg)||SORT.title(a,b)}
  };
  function matches(){
    var words=norm(state.q).split(/\s+/).filter(Boolean);
    return BOOKS.filter(function(b){
      if(state.cat&&b.c!==state.cat)return false;
      if(state.genre&&b.g.indexOf(state.genre)<0)return false;
      if(state.topic&&b.k.indexOf(state.topic)<0)return false;
      for(var i=0;i<words.length;i++){if(b._s.indexOf(words[i])<0)return false}
      return true;
    }).sort(SORT[state.sort]);
  }
  function render(){
    var list=matches(),grid=$('ll-grid');grid.textContent='';
    var frag=document.createDocumentFragment();
    list.slice(0,state.shown).forEach(function(b){frag.appendChild(card(b))});
    grid.appendChild(frag);
    $('ll-empty').hidden=list.length>0;
    var more=$('ll-more');more.hidden=list.length<=state.shown;
    if(!more.hidden)more.textContent='Show '+Math.min(PAGE,list.length-state.shown)+' more of '+(list.length-state.shown)+' remaining';
    var filtered=!!(state.q||state.cat||state.genre||state.topic);
    $('ll-count').innerHTML='<strong>'+list.length+'</strong> '+(list.length===1?'book':'books')+(filtered?' of '+BOOKS.length:'');
    $('ll-clear').hidden=!filtered;
    [].forEach.call(cats.children,function(c){c.setAttribute('aria-pressed',c.dataset.cat===state.cat?'true':'false')});
    $('ll-main').classList.toggle('list',state.view==='list');
    $('ll-vgrid').setAttribute('aria-pressed',state.view==='grid');$('ll-vlist').setAttribute('aria-pressed',state.view==='list');
  }
  function set(k,v){state[k]=v;if(k!=='view')state.shown=PAGE;render()}
  var timer;$('ll-q').addEventListener('input',function(e){clearTimeout(timer);var v=e.target.value;timer=setTimeout(function(){set('q',v)},120)});
  $('ll-genre').addEventListener('change',function(e){set('genre',e.target.value)});
  $('ll-topic').addEventListener('change',function(e){set('topic',e.target.value)});
  $('ll-sort').addEventListener('change',function(e){set('sort',e.target.value)});
  cats.addEventListener('click',function(e){var c=e.target.closest('.chip');if(c)set('cat',c.dataset.cat)});
  $('ll-grid').addEventListener('click',function(e){var t=e.target.closest('.tag');if(!t)return;var sel=$('ll-topic');var has=[].some.call(sel.options,function(o){return o.value===t.dataset.topic});if(has){sel.value=t.dataset.topic;set('topic',t.dataset.topic)}else{$('ll-q').value=t.dataset.topic;set('q',t.dataset.topic)}window.scrollTo(0,0)});
  $('ll-more').addEventListener('click',function(){state.shown+=PAGE;render()});
  $('ll-clear').addEventListener('click',function(){state.q=state.cat=state.genre=state.topic='';$('ll-q').value='';$('ll-genre').value='';$('ll-topic').value='';state.shown=PAGE;render()});
  $('ll-vgrid').addEventListener('click',function(){set('view','grid')});
  $('ll-vlist').addEventListener('click',function(){set('view','list')});
  render();
})();
</script>
</body>
</html>
